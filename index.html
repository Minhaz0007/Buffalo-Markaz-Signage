<!DOCTYPE html>
<!--
  background-color on <html> (not just <body>) ensures the navy background
  is painted by the browser BEFORE any CSS or JS loads, preventing the
  momentary green/white compositor flash that appears when Chrome's GPU
  layer is empty during a page reload.
-->
<html lang="en" style="background-color:#0B1E3B;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="build-version" content="BUILD_TIMESTAMP" />
    <!--
      theme-color tells the Chrome compositor (including Chromecast/AirPlay/HDMI
      tab-capture pipeline) what colour to use for the browser UI and any
      bare compositor frames that appear during page navigation, minimising the
      green flash that occurs when the GPU compositor layer empties mid-reload.
    -->
    <meta name="theme-color" content="#0B1E3B" />
    <title>Buffalo Markaz Masjid Signage</title>

    <!--
      CHUNK-LOAD GUARD — must run synchronously before any module loads.
      When Vercel deploys, old JS chunk filenames (with old content hashes)
      no longer exist. If the running page tries to load one → 404 → React
      crashes → Chrome compositor flashes green.
      This handler catches the failure immediately and reloads before React
      has a chance to crash, keeping the screen navy throughout.
    -->
    <script>
      (function () {
        // ── Reload-loop guard ──────────────────────────────────────────────────
        // reloadCacheBusted() uses window.location.replace() to load a fresh page.
        // If the NEW page ALSO has a chunk error (e.g. Vercel still propagating
        // new chunks), the guard would fire again → infinite loop of navy screens.
        // We cap this at 3 automatic reloads per browser session.
        var RELOAD_KEY      = 'signage_chunk_reload_count';
        var RELOAD_RESET_MS = 5 * 60 * 1000; // reset counter after 5 minutes
        var RELOAD_RESET_KEY= 'signage_chunk_reload_ts';
        var MAX_AUTO_RELOADS = 3;

        function getReloadCount() {
          try {
            var ts = parseInt(sessionStorage.getItem(RELOAD_RESET_KEY) || '0', 10);
            if (Date.now() - ts > RELOAD_RESET_MS) {
              sessionStorage.setItem(RELOAD_KEY, '0');
              sessionStorage.setItem(RELOAD_RESET_KEY, String(Date.now()));
              return 0;
            }
            return parseInt(sessionStorage.getItem(RELOAD_KEY) || '0', 10);
          } catch (e) { return 0; }
        }
        function incrementReloadCount() {
          try {
            var n = getReloadCount() + 1;
            sessionStorage.setItem(RELOAD_KEY, String(n));
            if (!sessionStorage.getItem(RELOAD_RESET_KEY)) {
              sessionStorage.setItem(RELOAD_RESET_KEY, String(Date.now()));
            }
          } catch (e) {}
        }

        function isChunkError(msg) {
          return (
            msg && (
              msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
              msg.indexOf('Importing a module script failed') !== -1 ||
              msg.indexOf('error loading dynamically imported module') !== -1 ||
              msg.indexOf('ChunkLoadError') !== -1
            )
          );
        }

        // Cache-busting reload: adds a unique ?_r=<timestamp> so the Vercel CDN
        // is forced to fetch fresh HTML from the origin.  window.location.reload()
        // is intentionally NOT used here — it is a soft reload that can return
        // stale CDN-cached HTML containing the old (now-404) chunk filenames,
        // causing an infinite reload loop and repeated green flashes.
        function reloadCacheBusted() {
          if (getReloadCount() >= MAX_AUTO_RELOADS) {
            // Too many rapid reloads — deployment probably isn't stable yet.
            // Wait 3 minutes then auto-retry. This screen runs unattended so we
            // can't rely on a human to tap "reload". After 3 min the deployment
            // should be fully propagated.
            console.warn('[SignageGuard] Max auto-reloads reached — waiting 3 min before retry.');
            var splash = document.getElementById('nav-splash');
            if (splash) {
              var remaining = 180;
              function updateMsg() {
                var el = document.getElementById('signage-countdown');
                if (el) el.textContent = 'Auto-reloading in ' + remaining + 's…';
              }
              splash.innerHTML = '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#D4AF37;font-family:sans-serif;text-align:center;padding:40px;">' +
                '<div style="font-size:28px;font-weight:bold;margin-bottom:12px;">Buffalo Markaz Masjid</div>' +
                '<div style="font-size:18px;color:#aaa;margin-bottom:8px;">Updating display…</div>' +
                '<div id="signage-countdown" style="font-size:16px;color:#666;margin-bottom:32px;">Auto-reloading in 180s…</div>' +
                '<button onclick="sessionStorage.clear();window.location.replace(window.location.pathname)" style="padding:12px 24px;background:#D4AF37;color:#0B1E3B;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;">Reload Now</button>' +
                '</div>';
              splash.style.display = 'block';
              // Countdown ticker
              var ticker = setInterval(function() {
                remaining--;
                updateMsg();
                if (remaining <= 0) { clearInterval(ticker); }
              }, 1000);
              // Auto-reload after 3 minutes — clears counter so we get 3 more tries
              setTimeout(function() {
                sessionStorage.clear();
                window.location.replace(window.location.pathname);
              }, 180000);
            }
            return;
          }
          // Show the persistent splash div so the screen stays navy while the
          // new page loads, preventing the GPU compositor green flash on HDMI.
          var splash = document.getElementById('nav-splash');
          if (splash) splash.style.display = 'block';

          incrementReloadCount();
          var url = new URL(window.location.href);
          url.searchParams.set('_r', Date.now().toString());
          window.location.replace(url.toString());
        }

        // Synchronous script errors (rare for ES modules but covers edge cases)
        window.addEventListener('error', function (e) {
          if (isChunkError(e.message)) {
            console.warn('[SignageGuard] Chunk load failure detected — reloading.');
            reloadCacheBusted();
          }
        });
        // Unhandled promise rejections — the primary path for dynamic import failures
        window.addEventListener('unhandledrejection', function (e) {
          var msg = (e.reason && (e.reason.message || e.reason.toString())) || '';
          if (isChunkError(msg)) {
            console.warn('[SignageGuard] Chunk load failure (promise) — reloading.');
            e.preventDefault(); // suppress console error
            reloadCacheBusted();
          }
        });

        // ── Ultimate splash fallback ──────────────────────────────────────────
        // If index.tsx fails to load at all (chunk 404, network error, etc.),
        // the setTimeout in index.tsx never runs. This inline timer fires
        // regardless of whether the JS module loaded. After 15 s of a visible
        // splash, it auto-reloads after a 2-minute countdown — no human needed.
        setTimeout(function() {
          var splash = document.getElementById('nav-splash');
          if (splash && splash.style.display !== 'none') {
            var remaining = 120;
            function updateMsg() {
              var el = document.getElementById('signage-fallback-countdown');
              if (el) el.textContent = 'Auto-reloading in ' + remaining + 's…';
            }
            splash.innerHTML = '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#D4AF37;font-family:sans-serif;text-align:center;padding:40px;">' +
              '<div style="font-size:28px;font-weight:bold;margin-bottom:12px;">Buffalo Markaz Masjid</div>' +
              '<div style="font-size:18px;color:#aaa;margin-bottom:8px;">Display is loading…</div>' +
              '<div id="signage-fallback-countdown" style="font-size:16px;color:#666;margin-bottom:32px;">Auto-reloading in 120s…</div>' +
              '<button onclick="sessionStorage.clear();window.location.replace(window.location.pathname)" style="padding:12px 24px;background:#D4AF37;color:#0B1E3B;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;">Reload Now</button>' +
              '</div>';
            var ticker = setInterval(function() {
              remaining--;
              updateMsg();
              if (remaining <= 0) { clearInterval(ticker); }
            }, 1000);
            // Auto-reload after 2 minutes
            setTimeout(function() {
              sessionStorage.clear();
              window.location.replace(window.location.pathname);
            }, 120000);
          }
        }, 15000); // 15 s: generous for slow connections; normal load hides splash in < 1 s
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              mosque: {
                navy: '#0B1E3B',
                gold: '#D4AF37',
                cream: '#F5F5DC',
                light: '#E2E8F0',
                dark: '#0f172a'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Amiri', 'serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #0B1E3B;
      }

      /* Performance-optimized animations - defined once globally */
      @keyframes scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100%); }
      }

      .animate-scroll {
        animation: scroll linear infinite;
        will-change: transform;
        /* Critical optimizations for 60Hz smooth scrolling */
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        transform-style: preserve-3d;
        -webkit-transform-style: preserve-3d;
        /* Prevent sub-pixel rendering blur */
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
        /* Font rendering optimization */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        /* Force hardware acceleration */
        transform: translateZ(0);
        -webkit-transform: translateZ(0);
      }

      @keyframes subtle-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(0.99); }
      }

      .animate-subtle-pulse {
        animation: subtle-pulse 4s ease-in-out infinite;
      }

      @keyframes textPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.95); }
      }

      @keyframes textBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @keyframes text-shine {
        0% { background-position: 0% 50%; }
        100% { background-position: 100% 50%; }
      }

      @keyframes gradient-text {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .animate-text-pulse { animation: textPulse 1.5s infinite ease-in-out; }
      .animate-text-blink { animation: textBlink 1s infinite steps(1); }
      .animate-text-shine { animation: text-shine 3s linear infinite; }
      .animate-gradient-text { animation: gradient-text 3s ease infinite; }
      .bg-300% { background-size: 300% 300%; }

      /* GPU acceleration for animated elements */
      .gpu-accelerated {
        transform: translateZ(0);
        -webkit-transform: translateZ(0);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        perspective: 1000px;
        -webkit-perspective: 1000px;
        transform-style: preserve-3d;
        -webkit-transform-style: preserve-3d;
      }

      /* Optimized container for smooth scrolling ticker */
      .ticker-container-optimized {
        /* Ensure smooth rendering */
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        /* Force GPU compositing */
        transform: translateZ(0);
        -webkit-transform: translateZ(0);
        /* Prevent layout shifts */
        contain: layout style paint;
        /* Optimize font rendering */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!--
      PERSISTENT NAVIGATION SPLASH — must be OUTSIDE React's #root.

      WHY this exists:
        When the signage app auto-updates it calls window.location.replace().
        At that moment the old page's DOM (including any React "Updating…"
        overlay) is torn down before the new page begins rendering.  Chrome's
        GPU compositor briefly has no content to composite, and on some GPU /
        HDMI-extended-display configurations that blank frame appears GREEN.

        This <div> is plain HTML — the browser paints it before any JavaScript
        runs, both on the INITIAL page load and on every subsequent navigation.
        React hides it immediately after mounting (see App.tsx first useEffect).
        AutoUpdate shows it again (via DOM, not React) before triggering any
        navigation, so the GPU compositor always has a navy frame to composite
        rather than going blank/green.

      z-index 9999 matches the React "Updating Display…" overlay so both are
      at the same stacking level during an update.  The React overlay sits
      inside #root which comes first in the DOM, so this sibling splash
      renders on top when both share z-index:9999.
    -->
    <div
      id="nav-splash"
      style="
        position: fixed;
        inset: 0;
        background-color: #0B1E3B;
        z-index: 9999;
        display: block;
        will-change: transform;
        transform: translateZ(0);
      "
    ></div>

    <script type="module" src="/index.tsx"></script>
  </body>
</html>
